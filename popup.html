<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Aura 开关与面板</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="mini-app">
  <!-- 微型硬件外壳 -->
  <div class="mini-console">
    <!-- 顶栏状态 -->
    <div class="console-head">
      <div class="brand-group">
        <span class="status-led" id="status-led"></span>
        <span class="brand-name">AURA</span>
      </div>
      <div style="display: flex; gap: 5px;">
        <button class="open-notebook-btn" id="btn-open-reader" title="打开 PDF 触感沉浸重排阅读器 (100% 原生文本，无错位)">
          <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
          <span>重排阅读</span>
        </button>
        <button class="open-notebook-btn" id="btn-open-sidepanel" title="打开原生阅读查词侧边栏 (快捷键 Alt+S)">
          <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14H5V5h7v12zm7 0h-5V5h5v12z"/></svg>
          <span>侧边栏</span>
        </button>
        <button class="open-notebook-btn" id="btn-open-notebook" title="在新标签页中打开生词本">
          <svg viewBox="0 0 24 24"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>
          <span>生词本</span>
          <span class="badge-count" id="badge-count">0</span>
        </button>
      </div>
    </div>

    <!-- 核心实体开关区域 -->
    <div class="switch-slot">
      <div class="slot-label">
        <span class="label-title">网页划词取词</span>
        <span class="label-state" id="state-text">已开启</span>
      </div>

      <!-- 新拟态实体拨动开关 -->
      <label class="tactile-switch">
        <input type="checkbox" id="power-toggle" checked>
        <span class="switch-track">
          <span class="switch-knob"></span>
        </span>
      </label>
    </div>

    <!-- 沉浸重排阅读提示 -->
    <div class="pdf-tip-slot" title="重排阅读器：提取纯净正文语义排版，100% 杜绝错位；或用侧边栏伴侣阅读原生 PDF">
      <span class="tip-dot">✨</span>
      <span class="tip-txt">点击<b>「重排阅读」</b>享电子书级排版，或用<b>侧边栏 (Alt+S)</b> 读原生 PDF</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
